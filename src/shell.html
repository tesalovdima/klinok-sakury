<title>Клинок Сакуры</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--FONTS-->
<style>
/*STYLE*/
</style>

<div id="app">
  <section id="battle" aria-label="Поле боя">
    <canvas id="scene"></canvas>
    <div class="hud">
      <div class="hud-row">
        <div class="hero-badge">
          <div class="lvl" title="Уровень"><div><small>ур.</small><span id="hLvl">1</span></div></div>
          <div class="bars">
            <div class="bar xp" title="Опыт"><i id="xpFill"></i></div>
            <div class="bar hp" title="Здоровье"><i id="hpFill"></i><span id="hpText"></span></div>
          </div>
        </div>
        <div class="purse">
          <span class="cur gold" title="Золото"><img id="icGold" alt=""><b id="goldText">0</b></span>
          <button class="cur gem" id="gemBtn" title="Самоцветы"><img id="icGem" alt=""><b id="gemText">0</b><i class="plus">+</i></button>
          <button id="settingsBtn" class="icon-btn" aria-label="Настройки"><img data-ic="settings" alt=""></button>
        </div>
      </div>
      <div class="stage-row" id="stageRow">
        <button class="stage-pill" id="stageBtn" aria-label="Открыть карту"><b id="stageNum">1-1</b><span id="stageName"></span></button>
        <div class="progress" title="Монстров до босса"><div class="bar kill"><i id="killFill"></i></div><span id="killText">0/10</span></div>
        <button class="boss-btn" id="bossBtn" disabled>Босс</button>
        <button class="auto-btn" id="autoBtn" aria-pressed="true" title="Вызывать босса автоматически">Авто</button>
      </div>
      <div class="boss-row" id="bossRow" hidden>
        <span id="bossName"></span>
        <div class="bar boss"><i id="bossFill"></i></div>
        <span id="bossTime">30</span>
      </div>
    </div>
    <div class="side">
      <button class="side-btn" id="questBtn" aria-label="Задания"><img data-ic="quests" alt=""><span>Задания</span><i class="dot" id="questDot" hidden></i></button>
      <button class="side-btn" id="giftBtn" aria-label="Бонусы"><img data-ic="gift" alt=""><span>Бонусы</span><i class="dot" id="giftDot" hidden></i></button>
      <span class="boost-chip" id="boostChip" hidden><img data-ic="boost" alt=""><b id="boostTime"></b></span>
    </div>
    <div class="skills" id="skillDock"></div>
  </section>
  <div class="chat" id="log" aria-live="polite" aria-label="Системные сообщения"></div>

  <main id="panel"></main>

  <nav id="tabs" role="tablist" aria-label="Разделы">
    <button role="tab" data-tab="hero" aria-selected="true"><img data-ic="hero" alt=""><span id="heroTabLabel">Героиня</span><i class="dot" id="heroDot" hidden></i></button>
    <button role="tab" data-tab="gear" aria-selected="false"><img data-ic="bag" alt="">Снаряжение<i class="dot" id="gearDot" hidden></i></button>
    <button role="tab" data-tab="pets" aria-selected="false"><img data-ic="paw" alt="">Питомцы<i class="dot" id="petDot" hidden></i></button>
    <button role="tab" data-tab="arena" aria-selected="false"><img data-ic="arena" alt="">Арена<i class="dot" id="arenaDot" hidden></i></button>
    <button role="tab" data-tab="shop" aria-selected="false"><img data-ic="shop" alt="">Магазин<i class="dot" id="shopDot" hidden></i></button>
  </nav>

  <div id="intro" hidden>
    <div class="intro-inner">
      <h1 class="logo"><span>Клинок</span><span>Сакуры</span></h1>
      <p class="intro-sub" id="introSub">Выберите героя для своего пути</p>
      <div class="pick">
        <button class="pick-card" data-body="girl" aria-pressed="true"><canvas></canvas><b>Героиня</b></button>
        <button class="pick-card" data-body="boy" aria-pressed="false"><canvas></canvas><b>Герой</b></button>
      </div>
      <div class="hair-row" id="hairRow"></div>
      <label class="name-field"><span>Имя</span><input id="heroNameIn" maxlength="12" autocomplete="off" spellcheck="false"></label>
      <div class="btn-row intro-btns"><button class="buy ghost" id="introCancel" hidden>Отмена</button><button class="buy pink" id="introGo">Начать путь</button></div>
    </div>
  </div>
</div>

<div id="modal" hidden></div>
<div id="toast" role="status"></div>

<script>
/*SCRIPTS*/
</script>
